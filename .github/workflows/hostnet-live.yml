name: Publiceer naar Hostnet live

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostnet-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOSTNET_HOST: ssh.cx44508jk.service.one
      # Tijdelijk het werkende IPv4-adres gebruiken wegens lokale DNS-problemen.
      HOSTNET_IP: 46.30.211.153
      HOSTNET_USER: cx44508jk_u
      HOSTNET_PATH: /home/cx44508jk_u/webroots/sites/httpdocs
      # De serversleutel die bij de eerste verbinding is geaccepteerd.
      HOSTNET_FINGERPRINT: SHA256:iDgAh/1dj9HyXk3nOztS6nK7jJI1IyR2uUrxDCF9kI8
    steps:
      - name: Haal de websitecode op
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Maak een pakket met uitsluitend websitebestanden
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html style.css; do
            test -s "$file"
          done
          test -d assets
          if find assets -type l -print -quit | grep -q .; then
            echo "Symbolische links in assets zijn niet toegestaan."
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/website.tar.gz" index.html style.css assets

      - name: Stel de SSH-sleutel in en controleer de server
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTNET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "HOSTNET_SSH_PRIVATE_KEY ontbreekt."; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/hostnet_deploy"
          chmod 600 "$HOME/.ssh/hostnet_deploy"
          ssh-keyscan -T 20 -p 22 -t ed25519 "$HOSTNET_IP" > "$RUNNER_TEMP/hostnet-key"
          actual=$(ssh-keygen -lf "$RUNNER_TEMP/hostnet-key" -E sha256 | awk '{print $2}')
          test "$actual" = "$HOSTNET_FINGERPRINT" || { echo "De serversleutel wijkt af. Publicatie gestopt."; exit 1; }
          awk -v host="$HOSTNET_HOST" '{print host, $2, $3}' "$RUNNER_TEMP/hostnet-key" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host hostnet-deploy
            HostName $HOSTNET_IP
            HostKeyAlias $HOSTNET_HOST
            User $HOSTNET_USER
            Port 22
            IdentityFile $HOME/.ssh/hostnet_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 30
          EOF
          chmod 600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

      - name: Publiceer de onepager naar de hoofdmap
        shell: bash
        run: |
          set -euo pipefail
          test "$HOSTNET_PATH" = "/home/cx44508jk_u/webroots/sites/httpdocs"
          # De doelmap moet al bestaan; nooit automatisch een andere map aanmaken.
          # Bestaande bestanden worden bijgewerkt, maar er wordt niets verwijderd.
          ssh hostnet-deploy "set -eu; cd '$HOSTNET_PATH'; test -d test-html; command -v tar >/dev/null; tar -xzf -" < "$RUNNER_TEMP/website.tar.gz"

      - name: Verwijder de tijdelijke privésleutel
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/hostnet_deploy"
